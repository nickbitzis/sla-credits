[project]
name = "slacredits"
version = "1.0.0"
description = "SLA and service credit engine for a made-up B2B SaaS vendor: contract-accurate uptime, credits, claims, disputes, and finance exports."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nick Bitzis" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
slacredits = "slacredits.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slacredits"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*httpx.*"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

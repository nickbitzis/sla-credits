name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uvx ruff check .
      - name: Test
        run: uv run --python 3.12 --group dev pytest -q

  credit-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Recompute March 2026 and fail if any credit moved without a contract or data change
        run: uv run --python 3.12 slacredits gate --golden golden/credits-2026-03.json
      - name: Finance export for the sample month
        run: |
          mkdir -p data
          uv run --python 3.12 slacredits --db data/ci.db export 2026-03 --format csv > data/credit-memos-2026-03.csv
          uv run --python 3.12 slacredits --db data/ci.db totals
      - uses: actions/upload-artifact@v4
        with:
          name: credit-memos-2026-03
          path: data/credit-memos-2026-03.csv

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sla-credits:ci
      - name: Smoke test the image
        run: |
          docker run -d --name api -p 8874:8874 sla-credits:ci
          for i in $(seq 1 60); do curl -sf localhost:8874/healthz && break; sleep 1; done
          curl -sf localhost:8874/v1/customers/c001/credits
          curl -sf "localhost:8874/v1/finance/memos?month=2026-03&format=csv" | head -3
          curl -sf localhost:8874/metrics | grep slacredits_accrual_usd_cents
          docker rm -f api
      - name: Gate runs inside the image
        run: docker run --rm sla-credits:ci gate --golden /app/golden/credits-2026-03.json
